    <rect x="86" y="722" width="1190" height="76" rx="14" fill="#17202a"/>
    <text x="118" y="770" font-size="24" font-weight="700" fill="#ffffff">Key insight: B2B performance must be measured beyond lead volume, through qualification, Sales nurturing, orders, pipeline and vendor fund compliance.</text>
