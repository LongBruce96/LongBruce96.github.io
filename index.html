<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Nguyen | Digital Growth Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: white;
    }

    .hero {
      width: 100%;
      max-width: 1200px;
      padding: 72px;
      border-radius: 24px;
      background: linear-gradient(135deg, #111827, #243746);
    }

    .eyebrow {
      color: #93c5fd;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: 56px;
    }

    h2 {
      margin: 0 0 24px;
      font-weight: 500;
      color: #d1d5db;
    }

    p {
      max-width: 780px;
      font-size: 18px;
      line-height: 1.7;
      color: #e5e7eb;
    }

    @media (max-width: 700px) {
      body {
        padding: 16px;
      }

      .hero {
        padding: 40px 24px;
      }

      h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <div class="eyebrow">Digital Growth Portfolio</div>
    <h1>Long Nguyen</h1>
    <h2>Digital Growth & Performance Marketer</h2>
    <p>
      I build full-funnel growth systems connecting performance marketing,
      content, SEO, website, CRM, events and sales follow-up to measurable
      business outcomes.
    </p>
  </section>
</body>
</html>
